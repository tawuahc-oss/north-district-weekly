<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>北區學生一週聚會安排</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f1e8;--paper:#fffdf9;--ink:#3e342b;--muted:#887b6d;--line:#e5dacb;--accent:#87684a;--soft:#f0e6d9;--danger:#a33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
body[data-theme=night]{--bg:#17191f;--paper:#22252d;--ink:#eee8df;--muted:#b3a89a;--line:#41434b;--accent:#c49a70;--soft:#30313a;--danger:#ff9a9a}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:1100px;margin:auto;padding:clamp(12px,3vw,28px)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:.7rem;letter-spacing:.1em;color:var(--accent);font-weight:800}h1{font-size:clamp(1.5rem,4vw,2.3rem);line-height:1.2;margin:4px 0 0}h2{font-size:1.2rem;margin:0}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--paper);color:var(--ink);font-weight:650}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{color:var(--danger)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:clamp(14px,2.5vw,22px);margin:14px 0;box-shadow:0 8px 26px #5d47210d}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.muted{color:var(--muted);font-size:.88rem}.notice{padding:12px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:.9rem}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.filter{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:.82rem}.filter input{accent-color:var(--accent);margin:0}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-weight:750}tr:last-child td{border-bottom:0}.weekday{white-space:nowrap;font-weight:750;width:105px}
.event-line{padding:9px 0;border-bottom:1px dashed var(--line)}.event-line:last-child{border-bottom:0}.event-title{font-weight:750}.tag{display:inline-block;font-size:.75rem;background:var(--soft);border-radius:999px;padding:2px 7px;margin-right:6px}.event-meta{font-size:.85rem;color:var(--muted);margin-top:3px;white-space:pre-wrap}.announcement{border:1px solid var(--line);border-radius:11px;padding:13px;margin:9px 0}.announcement h3{margin:0 0 5px;font-size:1.05rem}.announcement-content{white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:var(--muted);padding:16px 0}
.admin-panel,.login-box{display:none}.admin-panel.open,.login-box.open{display:block}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;font-size:.88rem;font-weight:650}input,select,textarea{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}textarea{min-height:90px;resize:vertical}.full,.form-actions{grid-column:1/-1}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:.85rem;color:var(--muted);min-height:1.4em;margin:8px 0}.status.error{color:var(--danger)}.admin-list-item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 0}.admin-list-item>div:first-child{min-width:0;overflow-wrap:anywhere}.small-actions{display:flex;gap:6px;flex-shrink:0}footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px}
@media(max-width:620px){header{align-items:flex-start}.actions{justify-content:flex-end}form{grid-template-columns:1fr}.full,.form-actions{grid-column:1}.weekday{width:78px}th,td{padding:8px;font-size:.9rem}.panel{padding:12px}.admin-list-item{flex-direction:column}.small-actions{align-self:flex-end}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">THE CHURCH OF GOD IN HONG KONG</div><h1>北區學生一週聚會安排</h1></div><div class="actions"><button id="themeBtn">切換夜間模式</button><button id="loginBtn">管理員登入</button></div></header>
<div id="globalStatus" class="status" role="status"></div>
<section class="panel"><div class="panel-head"><h2>每月特別通告</h2></div><div id="announcements"><div class="empty">正在載入通告……</div></div></section>
<section class="panel"><div class="panel-head"><h2>一週聚會恆常安排</h2><span class="muted">按分類篩選</span></div><div id="categoryFilters" class="filters"></div><div style="overflow-x:auto"><table><thead><tr><th>星期</th><th>聚會詳情</th></tr></thead><tbody id="weeklyBody"><tr><td colspan="2">正在載入聚會……</td></tr></tbody></table></div></section>
<section id="loginBox" class="panel login-box"><div class="panel-head"><h2>管理員登入</h2><button id="closeLogin" type="button">關閉</button></div><form id="loginForm"><label class="full">使用者名稱<input id="loginUsername" autocomplete="username" required></label><label class="full">密碼<input id="loginPassword" type="password" autocomplete="current-password" required></label><div class="form-actions"><button class="primary" type="submit">登入</button></div></form><div id="loginStatus" class="status"></div></section>
<section id="adminPanel" class="panel admin-panel"><div class="panel-head"><h2>管理員編輯區</h2><button id="logoutBtn">登出</button></div><div class="notice">新增、編輯或刪除資料後，公眾頁面會讀取資料庫中的最新內容。</div>
<section class="panel"><h2 style="margin-bottom:12px">編輯每週固定聚會</h2><form id="weeklyForm"><input type="hidden" id="weeklyId"><label>星期<select id="weekday"><option value="0">星期日</option><option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option></select></label><label>分類<select id="weeklyCategory"></select></label><label class="full">聚會名稱<input id="weeklyTitle" required maxlength="160"></label><label>開始時間<input id="weeklyStart" type="time"></label><label>結束時間<input id="weeklyEnd" type="time"></label><label>地點<input id="weeklyLocation" maxlength="200"></label><label>聯絡人<input id="weeklyContact" maxlength="120"></label><label class="full">補充資料<textarea id="weeklyNotes" maxlength="2000"></textarea></label><div class="form-actions"><button class="primary">儲存聚會</button><button type="button" id="weeklyReset">清除表格</button></div></form><div id="weeklyAdminList"></div></section>
<section class="panel"><h2 style="margin-bottom:12px">編輯每月特別通告</h2><form id="announcementForm"><input type="hidden" id="announcementId"><label class="full">通告標題<input id="announcementTitle" required maxlength="180"></label><label>開始日期<input id="announcementStartDate" type="date" required></label><label>結束日期（可留空）<input id="announcementEndDate" type="date"></label><label>分類（可留空）<select id="announcementCategory"></select></label><label>開始時間<input id="announcementStart" type="time"></label><label>結束時間<input id="announcementEnd" type="time"></label><label class="full">地點<input id="announcementLocation" maxlength="200"></label><label class="full">通告內容<textarea id="announcementContent" maxlength="5000"></textarea></label><div class="form-actions"><button class="primary">儲存通告</button><button type="button" id="announcementReset">清除表格</button></div></form><div id="announcementAdminList"></div></section></section>
<footer>北區學生一週聚會安排</footer></div>
<script>
/* 只填 Project URL、Publishable key 及管理員 Auth 電郵；不可放入 Secret/service_role key。 */
const SUPABASE_URL="https://ozoelkflqwwwypunrori.supabase.co/";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_2deqpMt-JEPIlHmimCXHYg_hXWpRlqb";
const ADMIN_USERNAME="admin";
const ADMIN_EMAIL="tawuahc@gmail.com";
const ADMIN_UID="ab786333-bad9-4e5b-af32-48300ea344fc";
const CATEGORIES=["親主Team","周間小組","愛筵","學生聚會","主日聚會","同工相聚","訓練聚會","預工","家生活"];
const DAYS=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const configured=SUPABASE_URL.startsWith("https://")&&SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")&&ADMIN_EMAIL.includes("@");
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
let weekly=[],notices=[],session=null,selected=new Set(CATEGORIES);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tm=t=>t?String(t).slice(0,5):"";
const range=(a,b)=>[tm(a),tm(b)].filter(Boolean).join("–");
function msg(id,s,error=false){$(id).textContent=s;$(id).classList.toggle("error",error)}
function categorySelect(id,blank=false){$(id).innerHTML=(blank?'<option value="">不指定</option>':"")+CATEGORIES.map(c=>`<option>${esc(c)}</option>`).join("");}
function filters(){ $("categoryFilters").innerHTML=CATEGORIES.map(c=>`<label class="filter"><input type="checkbox" checked value="${esc(c)}">${esc(c)}</label>`).join("");$("categoryFilters").addEventListener("change",e=>{if(e.target.matches("input")){e.target.checked?selected.add(e.target.value):selected.delete(e.target.value);renderWeekly();}});}
function renderWeekly(){
 $("weeklyBody").innerHTML=DAYS.map((day,i)=>{let arr=weekly.filter(x=>+x.weekday===i&&selected.has(x.category)).sort((a,b)=>(a.start_time||"").localeCompare(b.start_time||""));return `<tr><td class="weekday">${day}</td><td>${arr.length?arr.map(x=>`<div class="event-line"><div class="event-title"><span class="tag">${esc(x.category)}</span>${esc(x.title)}</div><div class="event-meta">${esc([range(x.start_time,x.end_time),x.location,x.contact_person?"聯絡："+x.contact_person:""].filter(Boolean).join("　·　"))}</div>${x.notes?`<div class="event-meta">${esc(x.notes)}</div>`:""}</div>`).join(""):'<span class="muted">暫無安排</span>'}</td></tr>`;}).join("");renderWeeklyAdmin();
}
function renderNotices(){
 const today=new Date();today.setHours(0,0,0,0);
 const arr=notices.filter(x=>new Date((x.end_date||x.start_date)+"T23:59:59")>=today).sort((a,b)=>a.start_date.localeCompare(b.start_date));
 $("announcements").innerHTML=arr.length?arr.map(x=>`<article class="announcement"><h3>${esc(x.title)}</h3><div class="event-meta">${esc(x.start_date)}${x.end_date&&x.end_date!==x.start_date?" 至 "+esc(x.end_date):""}${range(x.start_time,x.end_time)?"　·　"+esc(range(x.start_time,x.end_time)):""}${x.location?"　·　"+esc(x.location):""}</div>${x.category?`<div style="margin:7px 0"><span class="tag">${esc(x.category)}</span></div>`:""}${x.content?`<div class="announcement-content">${esc(x.content)}</div>`:""}</article>`).join(""):'<div class="empty">目前沒有特別通告。</div>';renderNoticeAdmin();
}
async function load(){
 if(!db){msg("globalStatus","尚未設定連線資料：請填入 Supabase Project URL、Publishable key 及管理員電郵。",true);$("weeklyBody").innerHTML='<tr><td colspan="2">尚未連接資料庫</td></tr>';$("announcements").textContent="尚未連接資料庫";return;}
 const [w,a]=await Promise.all([db.from("weekly_events").select("*").order("weekday").order("start_time"),db.from("monthly_announcements").select("*").order("start_date")]);
 if(w.error||a.error){msg("globalStatus","讀取失敗："+(w.error?.message||a.error?.message),true);return;}
 weekly=w.data||[];notices=a.data||[];msg("globalStatus","資料已更新");renderWeekly();renderNotices();await syncSession();
}
async function syncSession(){if(!db)return;const r=await db.auth.getSession();session=r.data.session;const admin=!!session&&session.user.id===ADMIN_UID;$("adminPanel").classList.toggle("open",admin);$("loginBtn").textContent=admin?"管理員已登入":"管理員登入";if(admin){renderWeeklyAdmin();renderNoticeAdmin();}}
function renderWeeklyAdmin(){if(!$("adminPanel").classList.contains("open"))return;$("weeklyAdminList").innerHTML="<h3>現有每週聚會</h3>"+weekly.map(x=>`<div class="admin-list-item"><div><strong>${DAYS[+x.weekday]} · ${esc(x.title)}</strong><div class="muted">${esc(x.category)} ${esc(range(x.start_time,x.end_time))}</div></div><div class="small-actions"><button data-ew="${x.id}">編輯</button><button class="danger" data-dw="${x.id}">刪除</button></div></div>`).join("");}
function renderNoticeAdmin(){if(!$("adminPanel").classList.contains("open"))return;$("announcementAdminList").innerHTML="<h3>現有特別通告</h3>"+notices.map(x=>`<div class="admin-list-item"><div><strong>${esc(x.title)}</strong><div class="muted">${esc(x.start_date)} ${esc(x.location)}</div></div><div class="small-actions"><button data-ea="${x.id}">編輯</button><button class="danger" data-da="${x.id}">刪除</button></div></div>`).join("");}
const v=id=>$(id).value.trim();
function resetW(){$("weeklyForm").reset();$("weeklyId").value=""}function resetA(){$("announcementForm").reset();$("announcementId").value=""}
$("weeklyReset").onclick=resetW;$("announcementReset").onclick=resetA;
$("weeklyForm").onsubmit=async e=>{e.preventDefault();if(!session)return;const id=v("weeklyId"),row={weekday:+v("weekday"),category:v("weeklyCategory"),title:v("weeklyTitle"),start_time:v("weeklyStart")||null,end_time:v("weeklyEnd")||null,location:v("weeklyLocation"),contact_person:v("weeklyContact"),notes:v("weeklyNotes")};const r=id?await db.from("weekly_events").update(row).eq("id",id):await db.from("weekly_events").insert(row);if(r.error){msg("globalStatus","儲存失敗："+r.error.message,true);return;}resetW();await load();};
$("announcementForm").onsubmit=async e=>{e.preventDefault();if(!session)return;const id=v("announcementId"),start=v("announcementStartDate"),end=v("announcementEndDate")||null;if(end&&end<start){msg("globalStatus","結束日期不可早於開始日期。",true);return;}const row={title:v("announcementTitle"),start_date:start,end_date:end,category:v("announcementCategory")||null,start_time:v("announcementStart")||null,end_time:v("announcementEnd")||null,location:v("announcementLocation"),content:v("announcementContent")};const r=id?await db.from("monthly_announcements").update(row).eq("id",id):await db.from("monthly_announcements").insert(row);if(r.error){msg("globalStatus","儲存失敗："+r.error.message,true);return;}resetA();await load();};
$("weeklyAdminList").onclick=async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.ew){let x=weekly.find(a=>String(a.id)===b.dataset.ew);$("weeklyId").value=x.id;$("weekday").value=x.weekday;$("weeklyCategory").value=x.category;$("weeklyTitle").value=x.title;$("weeklyStart").value=tm(x.start_time);$("weeklyEnd").value=tm(x.end_time);$("weeklyLocation").value=x.location||"";$("weeklyContact").value=x.contact_person||"";$("weeklyNotes").value=x.notes||"";$("weeklyForm").scrollIntoView({behavior:"smooth"});}if(b.dataset.dw&&confirm("確定刪除此聚會？")){let r=await db.from("weekly_events").delete().eq("id",b.dataset.dw);if(r.error)msg("globalStatus","刪除失敗："+r.error.message,true);else await load();}};
$("announcementAdminList").onclick=async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.ea){let x=notices.find(a=>String(a.id)===b.dataset.ea);$("announcementId").value=x.id;$("announcementTitle").value=x.title;$("announcementStartDate").value=x.start_date;$("announcementEndDate").value=x.end_date||"";$("announcementCategory").value=x.category||"";$("announcementStart").value=tm(x.start_time);$("announcementEnd").value=tm(x.end_time);$("announcementLocation").value=x.location||"";$("announcementContent").value=x.content||"";$("announcementForm").scrollIntoView({behavior:"smooth"});}if(b.dataset.da&&confirm("確定刪除此通告？")){let r=await db.from("monthly_announcements").delete().eq("id",b.dataset.da);if(r.error)msg("globalStatus","刪除失敗："+r.error.message,true);else await load();}};
$("loginBtn").onclick=()=>{if(session){$("adminPanel").scrollIntoView({behavior:"smooth"});return;}$("loginBox").classList.add("open");$("loginBox").scrollIntoView({behavior:"smooth"});};$("closeLogin").onclick=()=>$("loginBox").classList.remove("open");
$("loginForm").onsubmit=async e=>{e.preventDefault();if(!db){msg("loginStatus","請先完成 Supabase 設定。",true);return;}if(v("loginUsername")!==ADMIN_USERNAME){msg("loginStatus","使用者名稱或密碼不正確。",true);return;}let r=await db.auth.signInWithPassword({email:ADMIN_EMAIL,password:$("loginPassword").value});if(r.error){msg("loginStatus","登入失敗，請檢查登入資料。",true);return;}if(r.data.user.id!==ADMIN_UID){await db.auth.signOut();msg("loginStatus","此帳戶沒有管理員權限。",true);return;}$("loginBox").classList.remove("open");$("loginPassword").value="";await syncSession();msg("globalStatus","管理員登入成功。");$("adminPanel").scrollIntoView({behavior:"smooth"});};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();session=null;$("adminPanel").classList.remove("open");$("loginBtn").textContent="管理員登入";msg("globalStatus","已登出。");};
$("themeBtn").onclick=()=>{let night=document.body.dataset.theme!=="night";document.body.dataset.theme=night?"night":"day";$("themeBtn").textContent=night?"切換日間模式":"切換夜間模式";};
categorySelect("weeklyCategory");categorySelect("announcementCategory",true);filters();load();
</script>
</body></html>
